[package]
name = "mhnx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Monster Hunter XX (3DS/Switch) save & quest data library - no_std compatible"

[features]
# gamedata is on by default because dlc::bit_for_quest and the item box
# validation need the catalogue: a plain cargo test -p mhnx-core did not
# compile without it. The console build turns defaults off and asks for just
# this feature, so nothing grows there.
default = ["std", "gamedata"]
std = []
# game data tables (item/equip/monster names) - large, can be disabled
gamedata = []

[dependencies]
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
