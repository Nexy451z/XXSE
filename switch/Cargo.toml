[package]
name = "mhnx-switch"
version = "0.2.1"
edition = "2021"
description = "XXSE - Monster Hunter XX (NX) Save Editor for Nintendo Switch (libnx homebrew)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "XXSE"
path = "src/main.rs"

# The same sources can also be built as a staticlib (see README "Alternative
# build routes"); keep the lib target around so that route stays one flag away.
[lib]
name = "mhnx_switch"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
# Same analysis library as the PC build. Built without std; the knife-edge
# parts (zlib inflate/deflate) come from miniz_oxide which is pure Rust.
# gamedata is required: the item picker and every item name comes from the
# generated tables. Without it item_pick_matches() is always empty and the
# console cannot change an item id at all.
mhnx-core = { path = "../crates/mhnx-core", default-features = false, features = ["gamedata"] }

[profile.release]
opt-level = "s"
lto = false
codegen-units = 1
panic = "abort"
strip = "none"
debug = false

[profile.dev]
panic = "abort"