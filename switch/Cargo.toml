[package]
name = "mhnx-switch"
version = "0.1.0"
edition = "2021"
description = "MHXX MHNX Editor for Nintendo Switch (libnx homebrew / .nro)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "mhnxeditor"
path = "src/main.rs"

# The same sources can also be built as a staticlib (see README "Alternative
# build routes"); keep the lib target around so that route stays one flag away.
[lib]
name = "mhnx_switch"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
# Same analysis library as the PC build. Built without std; the knife-edge
# parts (zlib inflate/deflate) come from miniz_oxide which is pure Rust.
mhnx-core = { path = "../crates/mhnx-core", default-features = false }

[profile.release]
opt-level = "s"
lto = false
codegen-units = 1
panic = "abort"
strip = "none"
debug = false

[profile.dev]
panic = "abort"